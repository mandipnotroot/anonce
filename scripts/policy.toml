version = 1

# This is the only first-party file excluded from wording inspection.
# Keep examples here so regression tests can exercise real forbidden inputs.
[[rules]]
id = "authorship"
pattern = '(?i)\b(?:openai|anthropic|chatgpt|claude|copilot|codex|opencode|aider|windsurf|codeium|tabnine|deepseek|qwen|gemini|grok|chatsonic)\b|\b(?:gpt[- ]?\d[\w.-]*|mistral[ -]ai|xai)\b|\b(?:cursor|replit)[ -](?:agent|assistant)\b|\b(?:google|microsoft|amazon|meta)[ -](?:ai|assistant|copilot)\b'
samples = ["OpenAI", "Anthropic", "ChatGPT", "Claude", "Copilot", "Codex", "OpenCode", "Aider", "Windsurf", "Codeium", "Tabnine", "DeepSeek", "Qwen", "Gemini", "Grok", "GPT-6.1", "Mistral AI", "xAI", "Cursor assistant", "Replit agent", "Google AI"]

[[rules]]
id = "credit"
pattern = '(?i)\b(?:ai[- ]assisted|ai[- ]generated|artificial intelligence|code assistant|coding assistant|large language model|language model|written with the help of|assisted by|assisted-by|created using|generated by|written by an? ai)\b'
samples = ["AI-assisted", "AI-generated", "artificial intelligence", "code assistant", "coding assistant", "large language model", "written with the help of", "Assisted-by: tool", "created using", "generated by"]

[[rules]]
id = "identity"
pattern = '(?i)\[bot\]|\b(?:bot|assistant)[+@]|(?:copilot|codex|claude|chatgpt|opencode)[^\s<>]*@|\b(?:ai|llm)[-_.]?(?:bot|assistant)\b'
samples = ["someone[bot]", "bot@example.invalid", "assistant@example.invalid", "ai-bot", "llm_assistant"]

[[rules]]
id = "terminology"
pattern = '(?i)\b(?:phases?|stages?)\b|\bstep\s*(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b|\bmilestone\s*\d+\b'
samples = ["phase", "phases", "stage", "stages", "step 1", "step one", "milestone 2"]

[[rules]]
id = "typography"
pattern = '\u2014'
samples = ["\u2014"]

[dependency_identity]
name = 'dependabot[bot]'
email = '49699333+dependabot[bot]@users.noreply.github.com'

[[ordinary_headers]]
pattern = '^// Code generated by (?:sqlc|protoc|protoc-gen-go|stringer)(?: v[0-9]+(?:\.[0-9]+)*)?\. DO NOT EDIT\.$'
sample = '// Code generated by stringer. DO NOT EDIT.'
