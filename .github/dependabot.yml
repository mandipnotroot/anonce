version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    labels: ["component:ci", "semver:patch", "dependencies"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    labels: ["component:docs", "semver:patch", "dependencies"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    labels: ["component:server", "semver:patch", "dependencies"]
