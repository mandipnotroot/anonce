openapi: 3.1.0
info:
  title: anonce infrastructure API
  version: 0.0.0
  description: >-
    Local demonstration processes implement liveness, status, source discovery,
    and always-unavailable readiness. Protocol/discovery routes return 501 on
    their owning process; their successful responses below remain proposed.
    Cryptographic request formats are not published or stable. Round bulletins
    must bind an administrator-set per-member response_limit. Each authorization
    token remains single-use; identity-side allowance slots are never public.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: https://service.example.invalid
    description: Non-routable documentation example
paths:
  /healthz:
    get:
      operationId: liveness
      x-implementation-state: implemented
      summary: Process liveness without dependency checks
      responses:
        '200':
          description: Process is alive
          content:
            text/plain:
              schema:
                type: string
                const: ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    head:
      operationId: livenessHeaders
      responses:
        '200':
          description: Process is alive; no response body
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /readyz:
    get:
      operationId: readiness
      x-implementation-state: implemented
      summary: Always unavailable until storage and protocol controls exist
      responses:
        '503':
          $ref: '#/components/responses/NotReady'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    head:
      operationId: readinessHeaders
      responses:
        '503':
          description: Not ready; no response body
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v1/status:
    get:
      operationId: capabilities
      x-implementation-state: implemented
      summary: Explicit capability inventory
      responses:
        '200':
          description: Version and implemented capability identifiers
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, capabilities, demonstration]
                properties:
                  version:
                    type: string
                  capabilities:
                    type: array
                    items:
                      type: string
                  demonstration:
                    type: boolean
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    head:
      operationId: capabilitiesHeaders
      responses:
        '200':
          description: Capability response headers only
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /source:
    get:
      operationId: correspondingSource
      x-implementation-state: implemented
      summary: Redirect to the operator-configured exact corresponding source
      responses:
        '302':
          $ref: '#/components/responses/SourceRedirect'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
    head:
      operationId: correspondingSourceHeaders
      responses:
        '302':
          $ref: '#/components/responses/SourceRedirect'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v1/ca/certificate:
    get:
      operationId: membershipCertificate
      x-implementation-state: unavailable
      summary: Public membership CA certificate
      responses:
        '200':
          description: Public certificate only
          content:
            application/pem-certificate-chain:
              schema:
                type: string
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/ca/revocations:
    get:
      operationId: membershipRevocations
      x-implementation-state: unavailable
      summary: Signed public revocation list
      responses:
        '200':
          description: DER-encoded revocation list
          content:
            application/pkix-crl:
              schema:
                type: string
                format: binary
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/rounds/{round_id}/bulletin:
    get:
      operationId: roundBulletin
      x-implementation-state: unavailable
      summary: Retrieve a signed round bulletin
      parameters:
        - name: round_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: >-
            Signed bulletin bytes binding the common positive response_limit,
            round context, and release policy. Exact wire format pending review;
            no member quota counters or reservation slot identifiers are included.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Round not found
        '501':
          $ref: '#/components/responses/NotImplemented'
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    SourceRedirect:
      description: Bodyless redirect to the configured source URL
      headers:
        Location:
          required: true
          schema:
            type: string
            format: uri
    NotReady:
      description: Required storage, migrations, and protocol controls are absent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: not_ready
            message: Required storage, migrations, and protocol controls are not implemented.
    MethodNotAllowed:
      description: The infrastructure endpoint accepts only GET and HEAD
      headers:
        Allow:
          required: true
          schema:
            type: string
            const: GET, HEAD
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotImplemented:
      description: Capability unavailable; no protocol operation was performed
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code:
                type: string
                const: not_implemented
              message:
                type: string
